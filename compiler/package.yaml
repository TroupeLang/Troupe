name:                Troupe-compiler
version:             0.2.0.0
github:              "TroupeLang/Troupe"
license:             GPL-3
author:              "Aarhus University"
maintainer:          "aslan@cs.au.dk"
copyright:           "2025 Aarhus University"

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/githubuser/Troupe-compiler#readme>

# Dependencies shared by every component. hpack copies this list onto each one, so
# anything here is also a dependency of the wasm cross-build of `troupec` -- which is
# why the test-only packages (tasty, tasty-golden, optparse-applicative) and the
# host-process ones (process, shellwords) are declared per-component instead. The
# `golden` executable is where all five are actually used.
dependencies:
- base >= 4.7 && < 5
- zlib
- mtl
- containers
- pretty
- array
- transformers
- bytestring
- text
- base64-bytestring
- filepath
- directory
- strict
- aeson
- MissingH
- tagged
- sourcemap >= 0.1.7
- SHA

build-tools:
- alex
- happy

library:
  source-dirs: src
  ghc-options: -Wincomplete-patterns -Wincomplete-uni-patterns -Wunused-imports -Wunused-top-binds

# pico ml Info flow

executables:
  troupec:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -W
    # The wasm RTS is single-threaded, and -N asks for more than one capability.
    when:
    - condition: "!arch(wasm32)"
      ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
    - Troupe-compiler

  dclabels:
    main:      DCTest.hs
    source-dirs: dev-test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -W
    dependencies:
    - Troupe-compiler
    - aeson
    - bytestring


  irtester:
    main: Main.hs
    source-dirs: irtester
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - Troupe-compiler
  golden:
    main: Golden.hs
    source-dirs: test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - Troupe-compiler
    - tasty
    - tasty-golden
    - optparse-applicative
    - process
    - shellwords

tests:
  # The golden suite is built once, as the installed `golden` executable
  # (see above); `make test` runs it via `stack exec golden`. A duplicate
  # test-suite stanza from the same source was removed to avoid the two
  # builds silently diverging.
  ir2raw-test:
    main: IR2RawTest.hs
    source-dirs:
    - test/ir2raw-test
    - test/ir2raw-test/testcases
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - Troupe-compiler
  ir-sexp-test:
    main: IRSexpTest.hs
    source-dirs:
    - test/ir-sexp-test
    - test/ir2raw-test/testcases
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - Troupe-compiler
    - tasty
    - tasty-hunit
    - tasty-quickcheck
    - QuickCheck
  ir-sexp-corpus-test:
    main: Main.hs
    source-dirs:
    - test/ir-sexp-corpus
    - test/ir-sexp-shared
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - Troupe-compiler
    - tasty
    - tasty-hunit
    - directory
    - filepath
  ir-sexp-conformance-test:
    main: Main.hs
    source-dirs: test/ir-sexp-conformance
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - Troupe-compiler
    - tasty
    - tasty-hunit
    - directory
    - filepath
    - bytestring
    - base64-bytestring
    - zlib
  ir-sexp-corpus-troupe-test:
    main: Main.hs
    source-dirs:
    - test/ir-sexp-corpus-troupe
    - test/ir-sexp-shared
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - Troupe-compiler
    - tasty
    - tasty-hunit
    - directory
    - filepath
    - process
  dclabels-prop-test:
    main: DCLabelsProps.hs
    source-dirs: test/prop
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - Troupe-compiler
    - QuickCheck
    - tasty
    - tasty-quickcheck
  caseelim-prop-test:
    main: CaseElimProps.hs
    source-dirs: test/prop-caseelim
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - Troupe-compiler
    - QuickCheck
    - tasty
    - tasty-quickcheck
  labelrt-prop-test:
    main: LabelRoundtripProps.hs
    source-dirs: test/prop-labelrt
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - Troupe-compiler
    - QuickCheck
    - tasty
    - tasty-quickcheck
  synvarhash-test:
    main: SynVarHashTest.hs
    source-dirs: test/synvarhash-test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - Troupe-compiler
    - tasty
    - tasty-hunit
